# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
# See https://firebase.google.com/docs/app-hosting/configure
# Local development uses .env.local (never committed); keep the variable names in sync.
env:
  # Public Firebase web config: shipped to the browser anyway, not secret.
  # Needed at BUILD time because Next.js inlines NEXT_PUBLIC_* into the client bundle.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBCXY2bQkR7h71enf4wIVdi62zEo9g3fCQ"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "gym-app-com.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "gym-app-com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "gym-app-com.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "810367146132"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:810367146132:web:cd9e63ea9aa05dbd8c3c81"
    availability:
      - BUILD
      - RUNTIME

  # Admin SDK project (server only).
  - variable: FIREBASE_PROJECT_ID
    value: "gym-app-com"
    availability:
      - RUNTIME

  # Secrets live in Cloud Secret Manager. Create/rotate with:
  #   firebase apphosting:secrets:set <secretName>
  # and grant the backend access when prompted (or: firebase apphosting:secrets:grantaccess <secretName> --backend gym).
  - variable: FIREBASE_CLIENT_EMAIL
    secret: firebaseClientEmail
    availability:
      - RUNTIME
  - variable: FIREBASE_PRIVATE_KEY
    secret: firebasePrivateKey
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: geminiApiKey
    availability:
      - RUNTIME

  # --- Sentry (roadmap 2.9). Uncomment after creating the Sentry project. ---
  # DSN is public (it ends up in the browser bundle), so a plain value is fine.
  # - variable: NEXT_PUBLIC_SENTRY_DSN
  #   value: "https://<key>@o<org-id>.ingest.<region>.sentry.io/<project-id>"
  #   availability:
  #     - BUILD
  #     - RUNTIME
  # - variable: NEXT_PUBLIC_SENTRY_ENVIRONMENT
  #   value: "production"
  #   availability:
  #     - BUILD
  #     - RUNTIME
  # - variable: SENTRY_ORG
  #   value: "<org-slug>"
  #   availability:
  #     - BUILD
  # - variable: SENTRY_PROJECT
  #   value: "<project-slug>"
  #   availability:
  #     - BUILD
  # Source-map upload token: firebase apphosting:secrets:set sentryAuthToken
  # - variable: SENTRY_AUTH_TOKEN
  #   secret: sentryAuthToken
  #   availability:
  #     - BUILD
